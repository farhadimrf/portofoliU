<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBE88"/>
      <stop offset="50%" stop-color="#C5A46D"/>
      <stop offset="100%" stop-color="#9E7D47"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A46D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C5A46D" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#C5A46D" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Obsidian Background Plate -->
  <rect width="64" height="64" rx="14" fill="#0A0A0C"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>
  
  <!-- Subtle Inner Ambient Glow -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#C5A46D" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0A0A0C" stop-opacity="0"/>
  </radialGradient>
  <rect width="64" height="64" rx="14" fill="url(#centerGlow)"/>

  <!-- High-contrast Serif Monogram MRF -->
  <g filter="url(#goldGlow)">
    <text 
      x="32" 
      y="35" 
      font-family="'Cinzel', 'Cinzel Decorative', 'Georgia', 'Times New Roman', serif" 
      font-size="21" 
      font-weight="800" 
      letter-spacing="1.2px" 
      text-anchor="middle" 
      dominant-baseline="central" 
      fill="url(#goldGrad)"
    >MRF</text>
  </g>
</svg>